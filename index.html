<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Search</title>
    <style>
      :root {
        --bg: #f3f5f7;
        --bg-elevated: #ffffff;
        --bg-soft: #eef2f4;
        --panel: rgba(255, 255, 255, 0.8);
        --text: #121821;
        --muted: #5b6470;
        --muted-strong: #2e3844;
        --border: rgba(18, 24, 33, 0.08);
        --shadow: rgba(16, 22, 31, 0.06);
        --accent: #2f6bff;
        --accent-soft: #edf3ff;
        --chip: #f6f7f9;
        --chip-active: #eaf0ff;
        --nova-blue: #2f6bff;
        --nova-orange: #ff8a3d;
        --nova-green: #2dbd8a;
        --nova-purple: #7b61ff;
      }

      body.dark {
        --bg: #10151c;
        --bg-elevated: #171d25;
        --bg-soft: #1d242e;
        --panel: rgba(23, 29, 37, 0.9);
        --text: #edf2f8;
        --muted: #a5b0be;
        --muted-strong: #dfe8f5;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: rgba(0, 0, 0, 0.28);
        --accent: #7aa7ff;
        --accent-soft: rgba(122, 167, 255, 0.14);
        --chip: #1e2733;
        --chip-active: rgba(122, 167, 255, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        transition: background 0.2s ease, color 0.2s ease;
      }

      .page {
        width: min(1200px, 100%);
        margin: 0 auto;
        min-height: 100vh;
        padding: 18px 24px 40px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 6px 0 18px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 0.97rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .brand-mark {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--nova-blue), var(--nova-purple));
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .action-btn, .theme-btn {
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        cursor: pointer;
      }

      .theme-btn {
        min-width: 90px;
      }

      .main-center {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 120px);
      }

      .search-shell {
        width: min(760px, 100%);
      }

      .logo {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 18px;
      }

      .wordmark {
        font-size: clamp(2.8rem, 6vw, 4.8rem);
        line-height: 1;
        letter-spacing: -0.08em;
        font-weight: 700;
        color: var(--text);
      }

      .wordmark .n { color: var(--nova-blue); }
      .wordmark .o1 { color: var(--nova-orange); }
      .wordmark .v { color: var(--nova-green); }
      .wordmark .a { color: var(--nova-purple); }

      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 26px;
        min-height: 64px;
        padding: 0 16px 0 18px;
        box-shadow: 0 10px 22px var(--shadow);
      }

      .search-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }

      .search-icon {
        width: 20px;
        height: 20px;
        opacity: 0.75;
      }

      .search-input {
        flex: 1;
        border: 0;
        background: transparent;
        outline: none;
        color: var(--text);
        font-size: 1.08rem;
        font-family: inherit;
      }

      .search-input::placeholder {
        color: var(--muted);
      }

      .submit {
        border: 0;
        background: var(--accent);
        color: white;
        border-radius: 14px;
        padding: 11px 18px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
      }

      .filters {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .chip {
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        cursor: pointer;
      }

      .chip.active {
        background: var(--chip-active);
        color: var(--accent);
        border-color: rgba(47, 107, 255, 0.15);
      }

      .quick-links {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 12px;
        margin-top: 28px;
      }

      .quick-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 18px;
        min-height: 108px;
        padding: 12px 10px;
        text-decoration: none;
        color: var(--text);
      }

      .quick-icon {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 0.82rem;
        font-weight: 700;
        color: white;
      }

      .quick-name {
        font-size: 0.86rem;
        font-weight: 600;
      }

      .quick-sub {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .gicon { background: linear-gradient(135deg, #4285f4, #6e9efa); }
      .ghicon { background: linear-gradient(135deg, #1f2328, #4a545f); }
      .yticon { background: linear-gradient(135deg, #ff3d3d, #ff7b7b); }
      .wikiicon { background: linear-gradient(135deg, #4a6cf7, #7a8efb); }
      .newsicon { background: linear-gradient(135deg, #1dbf73, #36d399); }

      @media (max-width: 700px) {
        .page { padding: 16px 18px 28px; }
        .topbar { flex-direction: column; align-items: flex-start; }
        .quick-links { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Nova</span>
        </div>
        <div class="top-actions">
          <button class="action-btn" type="button">Images</button>
          <button class="action-btn" type="button">News</button>
          <button class="theme-btn" id="themeToggle" type="button">Dark</button>
        </div>
      </header>

      <main class="main-center">
        <section class="search-shell" aria-label="Search area">
          <div class="logo">
            <div class="wordmark" aria-label="Nova Search logo">
              <span class="n">N</span><span class="o1">o</span><span class="v">v</span><span class="a">a</span>
            </div>
          </div>

          <form id="searchForm">
            <div class="search-box">
              <div class="search-left">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"></circle>
                  <path d="M16 16L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                </svg>
                <input id="searchInput" class="search-input" type="text" placeholder="Search the web" autocomplete="off" />
              </div>
              <button class="submit" type="submit">Search</button>
            </div>
          </form>

          <div class="filters" aria-label="Search filters">
            <button class="chip active" type="button">Web</button>
            <button class="chip" type="button">Images</button>
            <button class="chip" type="button">Videos</button>
            <button class="chip" type="button">News</button>
            <button class="chip" type="button">Maps</button>
          </div>

          <div class="quick-links" aria-label="Quick links">
            <a class="quick-card" href="https://www.google.com" target="_blank" rel="noreferrer">
              <div class="quick-icon gicon">G</div>
              <div class="quick-name">Google</div>
              <div class="quick-sub">Search</div>
            </a>
            <a class="quick-card" href="https://github.com" target="_blank" rel="noreferrer">
              <div class="quick-icon ghicon">GH</div>
              <div class="quick-name">GitHub</div>
              <div class="quick-sub">Code</div>
            </a>
            <a class="quick-card" href="https://www.youtube.com" target="_blank" rel="noreferrer">
              <div class="quick-icon yticon">YT</div>
              <div class="quick-name">YouTube</div>
              <div class="quick-sub">Video</div>
            </a>
            <a class="quick-card" href="https://en.wikipedia.org" target="_blank" rel="noreferrer">
              <div class="quick-icon wikiicon">W</div>
              <div class="quick-name">Wiki</div>
              <div class="quick-sub">Learn</div>
            </a>
            <a class="quick-card" href="https://news.google.com" target="_blank" rel="noreferrer">
              <div class="quick-icon newsicon">N</div>
              <div class="quick-name">News</div>
              <div class="quick-sub">Updates</div>
            </a>
          </div>
        </section>
      </main>
    </div>

    <script>
      const form = document.getElementById("searchForm");
      const input = document.getElementById("searchInput");
      const chips = document.querySelectorAll(".chip");
      const themeToggle = document.getElementById("themeToggle");

      function buildSearchUrl(query, mode) {
        const q = query.trim();
        if (!q) return null;

        const lower = q.toLowerCase();

        if (/^https?:\/\//i.test(q) || /^www\./i.test(q) || /^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(q)) {
          return /^https?:\/\//i.test(q) ? q : "https://" + q;
        }

        if (lower === "youtube" || lower.startsWith("youtube ")) {
          const rest = q.replace(/^youtube\s+/i, "");
          return "https://www.youtube.com/results?search_query=" + encodeURIComponent(rest);
        }

        if (lower === "github" || lower.startsWith("github ")) {
          const rest = q.replace(/^github\s+/i, "");
          return "https://github.com/search?q=" + encodeURIComponent(rest);
        }

        if (lower === "wikipedia" || lower.startsWith("wikipedia ")) {
          const rest = q.replace(/^wikipedia\s+/i, "");
          return "https://en.wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(rest);
        }

        if (lower === "reddit" || lower.startsWith("reddit ")) {
          const rest = q.replace(/^reddit\s+/i, "");
          return "https://www.reddit.com/search/?q=" + encodeURIComponent(rest);
        }

        if (mode === "images") {
          return "https://www.google.com/search?q=" + encodeURIComponent(q) + "&tbm=isch";
        }
        if (mode === "videos") {
          return "https://www.google.com/search?q=" + encodeURIComponent(q) + "&tbm=vid";
        }
        if (mode === "news") {
          return "https://news.google.com/search?q=" + encodeURIComponent(q);
        }
        if (mode === "maps") {
          return "https://www.google.com/maps/search/" + encodeURIComponent(q);
        }

        return "https://www.google.com/search?q=" + encodeURIComponent(q);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const mode = document.querySelector(".chip.active")?.textContent?.trim().toLowerCase() || "web";
        const url = buildSearchUrl(input.value, mode);
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      });

      chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          chips.forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
        });
      });

      const savedTheme = localStorage.getItem("nova-theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeToggle.textContent = "Light";
      }

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        themeToggle.textContent = dark ? "Light" : "Dark";
        localStorage.setItem("nova-theme", dark ? "dark" : "light");
      });
    </script>
  </body>
</html>
