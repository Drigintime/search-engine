<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Search</title>
    <style>
      :root {
        --bg: #f5f6f7;
        --panel: #ffffff;
        --muted: #5d6678;
        --muted-light: #8a93a6;
        --text: #1c2430;
        --border: #e3e7ee;
        --shadow: rgba(18, 24, 34, 0.06);
        --orange: #f5a623;
        --orange-deep: #e08100;
        --blue: #2d6df6;
        --green: #2aa870;
        --purple: #6d5ef5;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }

      .page {
        width: min(1200px, 100%);
        padding: 18px 20px 42px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 6px 4px 22px;
        font-size: 0.9rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.03em;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--orange), #ffcd68);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5);
      }

      .brand-name {
        font-size: 1.1rem;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
      }

      .link-pill {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255,255,255,0.3);
        cursor: pointer;
        transition: border-color 0.2s ease;
      }

      .link-pill:hover {
        border-color: #cfd7e4;
      }

      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 30px;
      }

      .search-panel {
        width: min(780px, 100%);
      }

      .logo-row {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 18px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: clamp(2.3rem, 6vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.07em;
        color: #1d2430;
      }

      .logo-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffca63, var(--orange));
        box-shadow: 0 0 0 6px rgba(245, 166, 35, 0.12);
      }

      .search-wrap {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 12px 24px var(--shadow);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        min-height: 62px;
      }

      .icon {
        width: 22px;
        height: 22px;
        color: var(--muted-light);
        flex: none;
      }

      .search-input {
        flex: 1;
        border: 0;
        background: transparent;
        outline: none;
        color: var(--text);
        font-size: 1.05rem;
        font-family: inherit;
      }

      .search-input::placeholder {
        color: var(--muted-light);
      }

      .submit-btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 18px;
        background: #1c2430;
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .submit-btn:hover {
        transform: translateY(-1px);
      }

      .filters {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .filter {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.5);
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .filter.active {
        background: #eef3ff;
        color: var(--blue);
        border-color: #d6e0ff;
      }

      .favorites {
        margin-top: 32px;
        width: min(820px, 100%);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
      }

      .favorite {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(255,255,255,0.5);
        border: 1px solid var(--border);
        border-radius: 18px;
        min-height: 110px;
        padding: 16px 12px;
        text-decoration: none;
        color: var(--text);
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .favorite:hover {
        transform: translateY(-2px);
        border-color: #d5dbe7;
        box-shadow: 0 10px 22px rgba(18,24,34,0.05);
      }

      .favorite-mark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: white;
      }

      .favorite-name {
        font-size: 0.9rem;
        font-weight: 600;
      }

      .favorite-sub {
        font-size: 0.72rem;
        color: var(--muted);
      }

      .favorites .g { background: linear-gradient(135deg, #dd4b39, #f0674f); }
      .favorites .gh { background: linear-gradient(135deg, #171717, #404040); }
      .favorites .yt { background: linear-gradient(135deg, #ff2d55, #ff6b6b); }
      .favorites .w { background: linear-gradient(135deg, #2d6df6, #6c8ef7); }
      .favorites .r { background: linear-gradient(135deg, #ff5b2e, #ff8a4d); }
      .favorites .n { background: linear-gradient(135deg, #12a860, #33d17a); }

      @media (max-width: 640px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .search-wrap {
          padding: 10px 12px;
          min-height: 56px;
        }

        .submit-btn {
          padding: 10px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">Quill</span>
        </div>
        <div class="top-actions">
          <span class="link-pill">Apps</span>
          <span class="link-pill">Privacy</span>
        </div>
      </header>

      <main class="shell">
        <section class="search-panel" aria-label="Search panel">
          <div class="logo-row">
            <div class="logo"><span class="logo-dot"></span>Quill</div>
          </div>

          <form id="searchForm">
            <div class="search-wrap">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"></circle>
                <path d="M16 16L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              </svg>
              <input id="searchInput" class="search-input" type="text" placeholder="Search the web without tracking" autocomplete="off" />
              <button class="submit-btn" type="submit">Search</button>
            </div>
          </form>

          <div class="filters" aria-label="Search options">
            <button class="filter active" type="button">All</button>
            <button class="filter" type="button">Images</button>
            <button class="filter" type="button">Videos</button>
            <button class="filter" type="button">News</button>
            <button class="filter" type="button">Maps</button>
          </div>
        </section>

        <section class="favorites" aria-label="Favorite sites">
          <a class="favorite" href="https://www.google.com" target="_blank" rel="noreferrer">
            <div class="favorite-mark g">G</div>
            <div class="favorite-name">Google</div>
            <div class="favorite-sub">Search</div>
          </a>

          <a class="favorite" href="https://github.com" target="_blank" rel="noreferrer">
            <div class="favorite-mark gh">GH</div>
            <div class="favorite-name">GitHub</div>
            <div class="favorite-sub">Code</div>
          </a>

          <a class="favorite" href="https://www.youtube.com" target="_blank" rel="noreferrer">
            <div class="favorite-mark yt">YT</div>
            <div class="favorite-name">YouTube</div>
            <div class="favorite-sub">Video</div>
          </a>

          <a class="favorite" href="https://en.wikipedia.org" target="_blank" rel="noreferrer">
            <div class="favorite-mark w">W</div>
            <div class="favorite-name">Wiki</div>
            <div class="favorite-sub">Learn</div>
          </a>

          <a class="favorite" href="https://www.reddit.com" target="_blank" rel="noreferrer">
            <div class="favorite-mark r">R</div>
            <div class="favorite-name">Reddit</div>
            <div class="favorite-sub">Forum</div>
          </a>

          <a class="favorite" href="https://www.nytimes.com" target="_blank" rel="noreferrer">
            <div class="favorite-mark n">N</div>
            <div class="favorite-name">News</div>
            <div class="favorite-sub">Updates</div>
          </a>
        </section>
      </main>
    </div>

    <script>
      const form = document.getElementById('searchForm');
      const input = document.getElementById('searchInput');
      const filters = document.querySelectorAll('.filter');

      const siteMap = {
        google: 'https://www.google.com/search?q=',
        github: 'https://github.com/search?q=',
        youtube: 'https://www.youtube.com/results?search_query=',
        wikipedia: 'https://en.wikipedia.org/wiki/Special:Search?search=',
        reddit: 'https://www.reddit.com/search/?q=',
        amazon: 'https://www.amazon.com/s?k=',
        news: 'https://news.google.com/search?q=',
        maps: 'https://www.google.com/maps/search/'
      };

      function normalizeTheme(value) {
        return value.trim();
      }

      function buildUrl(query, mode = 'all') {
        const q = normalizeTheme(query);
        if (!q) return null;

        const lower = q.toLowerCase();

        if (q === 'youtube') return 'https://www.youtube.com/';
        if (q === 'github') return 'https://github.com/';
        if (q === 'google') return 'https://www.google.com/';
        if (q === 'reddit') return 'https://www.reddit.com/';
        if (q === 'wikipedia') return 'https://www.wikipedia.org/';

        if (/^https?:\/\//i.test(q)) return q;
        if (/^www\./i.test(q) || /^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(q)) return 'https://' + q;

        const directWord = Object.keys(siteMap).find((name) => lower === name || lower.startsWith(name + ' '));
        if (directWord) {
          const rest = lower.startsWith(directWord + ' ') ? q.replace(new RegExp('^' + directWord + '\\s+', 'i'), '') : '';
          return rest ? siteMap[directWord] + encodeURIComponent(rest) : siteMap[directWord].replace(/search\?q=/, '').replace(/results\?search_query=/, '').replace(/wiki\/Special:Search\?search=/, '') || siteMap[directWord];
        }

        if (mode === 'images') return 'https://www.google.com/search?q=' + encodeURIComponent(q) + '&tbm=isch';
        if (mode === 'videos') return 'https://www.google.com/search?q=' + encodeURIComponent(q) + '&tbm=vid';
        if (mode === 'news') return 'https://news.google.com/search?q=' + encodeURIComponent(q);
        if (mode === 'maps') return 'https://www.google.com/maps/search/' + encodeURIComponent(q);

        return 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const selected = document.querySelector('.filter.active')?.textContent?.trim().toLowerCase() || 'all';
        const url = buildUrl(input.value, selected);
        if (url) window.open(url, '_blank', 'noopener,noreferrer');
      });

      filters.forEach((button) => {
        button.addEventListener('click', () => {
          filters.forEach((b) => b.classList.remove('active'));
          button.classList.add('active');
        });
      });
    </script>
  </body>
</html>
