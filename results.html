<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Results</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --bg-soft: #eef2f6;
        --panel: #ffffff;
        --panel-alt: #f8f9fb;
        --text: #1b2330;
        --muted: #5f6b7a;
        --muted-2: #7c8797;
        --border: rgba(17, 24, 39, 0.08);
        --shadow: rgba(15, 23, 42, 0.06);
        --accent: #2f6bff;
        --accent-soft: #edf3ff;
        --chip: #f5f7fa;
        --chip-active: #e9f0ff;
        --success: #2dbb83;
        --warning: #ff9254;
        --blue: #2f6bff;
        --purple: #7a5cf7;
        --green: #22a06b;
        --red: #ff5b57;
      }

      body.dark {
        --bg: #0f141b;
        --bg-soft: #171f28;
        --panel: #171f28;
        --panel-alt: #1b2430;
        --text: #edf3ff;
        --muted: #a5b1c2;
        --muted-2: #7f8da5;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: rgba(0, 0, 0, 0.28);
        --accent: #8ab4ff;
        --accent-soft: rgba(138, 180, 255, 0.12);
        --chip: #1a2430;
        --chip-active: rgba(138, 180, 255, 0.16);
        --success: #43d39e;
        --warning: #ffb27d;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body { transition: background 0.2s ease, color 0.2s ease; }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1200px, 100%);
        margin: 0 auto;
        padding: 18px 22px 42px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        padding-bottom: 18px;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--blue), var(--purple));
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.02rem;
      }

      .search-header {
        display: flex;
        align-items: center;
        gap: 16px;
        flex: 1;
        max-width: 840px;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 10px 14px 10px 16px;
        box-shadow: 0 10px 18px var(--shadow);
      }

      .search-box svg {
        width: 20px;
        height: 20px;
        color: var(--muted);
        flex: none;
      }

      .search-input {
        flex: 1;
        background: transparent;
        border: 0;
        outline: none;
        font-size: 1.02rem;
        color: var(--text);
      }

      .search-input::placeholder {
        color: var(--muted-2);
      }

      .search-btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 18px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .theme-btn {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 9px 14px;
        cursor: pointer;
      }

      .results-wrap {
        display: flex;
        align-items: flex-start;
        gap: 26px;
      }

      .sidebar {
        width: 220px;
        padding-top: 8px;
      }

      .side-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px 16px;
        box-shadow: 0 8px 20px var(--shadow);
      }

      .side-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted-2);
        margin-bottom: 14px;
        font-weight: 700;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .filter-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--text);
        font-size: 0.92rem;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }

      .filter-item:last-child { border-bottom: 0; }

      .filter-item .tag {
        background: var(--chip);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 999px;
        font-size: 0.72rem;
        padding: 4px 8px;
      }

      .main-results {
        flex: 1;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .tab-list {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tab {
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .tab.active {
        background: var(--chip-active);
        color: var(--accent);
        border-color: rgba(47,107,255,0.15);
      }

      .result-list {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .result-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 18px 20px;
        box-shadow: 0 8px 18px var(--shadow);
      }

      .result-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .domain {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .favicon {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 0.68rem;
        font-weight: 700;
        color: white;
        flex: none;
      }

      .favicon.g { background: linear-gradient(135deg, #4285f4, #6fa3ff); }
      .favicon.github { background: linear-gradient(135deg, #1d2128, #4b5563); }
      .favicon.yt { background: linear-gradient(135deg, #ff3d3d, #ff7b7b); }
      .favicon.w { background: linear-gradient(135deg, #4d6de6, #7d8efa); }
      .favicon.r { background: linear-gradient(135deg, #ff734d, #ff975f); }
      .favicon.n { background: linear-gradient(135deg, #1abc73, #3cd3a0); }
      .favicon.m { background: linear-gradient(135deg, #c71d1d, #ff6b6b); }
      .favicon.d { background: linear-gradient(135deg, #3a7bd5, #00d2ff); }
      .favicon.s { background: linear-gradient(135deg, #ff8c42, #ffb000); }
      .favicon.p { background: linear-gradient(135deg, #6b46c1, #a78bfa); }
      .favicon.a { background: linear-gradient(135deg, #16a085, #2dd4bf); }

      .result-title {
        margin-top: 10px;
        font-size: clamp(1.08rem, 1.8vw, 1.42rem);
        font-weight: 700;
        line-height: 1.4;
        color: var(--accent);
      }

      .result-url {
        margin-top: 4px;
        color: var(--success);
        font-size: 0.82rem;
        word-break: break-all;
      }

      .result-snippet {
        margin-top: 8px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.96rem;
      }

      .meta-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .badge {
        border: 1px solid var(--border);
        background: var(--accent-soft);
        color: var(--accent);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 700;
      }

      .muted-text {
        color: var(--muted-2);
        font-size: 0.8rem;
      }

      @media (max-width: 860px) {
        .results-wrap { flex-direction: column; }
        .sidebar { width: 100%; }
        .search-header {
          flex-direction: column;
          align-items: stretch;
          width: 100%;
        }
        .theme-btn { align-self: flex-end; }
      }

      @media (max-width: 560px) {
        .page { padding: 14px 16px 28px; }
        .search-box { padding: 10px 12px; }
        .search-btn { padding: 10px 14px; }
        .result-card { padding: 16px 14px; }
      }
    </style>
  </head>

          </div>

          <div id="resultList" class="result-list" aria-live="polite"></div>
        </main>
      </div>
    </div>

      ];

      function getInitialQuery() {
        const params = new URLSearchParams(window.location.search);
        return params.get("q") || "developer tools";
      }

      function getInitialMode() {
        const params = new URLSearchParams(window.location.search);
        return params.get("mode") || "all";
      }

      function makeResultCard(item, index) {
        const domain = item.domain || "example.com";
        const letter = (domain[0] || "N").toUpperCase();
        const faviconClass = /^[a-z]/.test(letter) ? letter.toLowerCase().charAt(0) : "g";

        return `
          <article class="result-card" data-index="${index}">
            <div class="result-top">
              <div class="domain">
                <span class="favicon ${faviconClass}">${letter}</span>
                ${domain}
              </div>
              <span class="muted-text">#${index + 1}</span>
            </div>
            <div class="result-title">
              <a href="${item.url}" target="_blank" rel="noreferrer">${item.title}</a>
            </div>
            <div class="result-url">${item.url}</div>
            <div class="result-snippet">${item.snippet}</div>
            <div class="meta-row">
              <span class="badge">${item.badge || "Result"}</span>
              <span class="muted-text">popular resource</span>
            </div>
          </article>
        `;
      }

      function renderResults(query = "", mode = "all") {
        const safeQuery = query.trim().toLowerCase();
        const filtered = resultData.filter((item) => {
          const text = [item.title, item.url, item.domain, item.snippet, item.badge].join(" ").toLowerCase();
          const matchesQuery = !safeQuery || text.includes(safeQuery);
          const matchesMode = mode === "all" || item.badge.toLowerCase() === mode.toLowerCase() || (
            mode === "web" && ["search", "code", "docs", "community", "learning", "frontend", "backend", "cloud", "tools", "products"].includes(item.badge.toLowerCase())
          );
          return matchesQuery && matchesMode;
        });

        resultList.innerHTML = filtered.length
          ? filtered.map((item, index) => makeResultCard(item, index)).join("")
          : `
            <article class="result-card">
              <div class="result-title">No results found for “${query}”</div>
              <div class="result-snippet">Try a broader term like “developer tools”, “cloud services”, or “frontend frameworks”.</div>
            </article>
          `;
      }

      function runSearch() {
        const q = searchInput.value.trim();
        const mode = document.querySelector(".tab.active")?.textContent?.trim().toLowerCase() || "all";

        const params = new URLSearchParams(window.location.search);
        if (q) params.set("q", q);
        params.set("mode", mode);
        const url = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState({}, "", url);

        renderResults(q, mode);
      }

      const initialQuery = getInitialQuery();
      const initialMode = getInitialMode();

      if (initialQuery) {
        searchInput.value = initialQuery;
      }

      tabs.forEach((tab) => {
        const tabName = tab.textContent.trim().toLowerCase();
        if (tabName === initialMode) {
          tab.classList.add("active");
        } else {
          tab.classList.remove("active");
        }

        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          runSearch();
        });
      });

      searchBtn.addEventListener("click", runSearch);
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          runSearch();
        }
      });

      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeToggle.textContent = "Light";
      }

      function syncTheme() {
        const dark = document.body.classList.contains("dark");
        themeToggle.textContent = dark ? "Light" : "Dark";
        localStorage.setItem("nova-results-theme", dark ? "dark" : "light");
      }

      const savedTheme = localStorage.getItem("nova-results-theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
      }

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        syncTheme();
      });

      renderResults(initialQuery, initialMode);
    </script>
  </body>
